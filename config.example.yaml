# Copy to ~/.config/swisslifeops/config.yaml and fill in your own values.
# This example contains placeholders only - no real personal data.

profile:
  full_name: "Your Name"
  location: "Your Town, Switzerland"
  languages: ["German C1", "English C2"]
  cv_url: "https://example.com/cv"
  available_from: "immediately"

documents:
  dir: "~/lifeops-docs"          # your local docs folder (git-ignored)
  default_dossier: ["cv.pdf", "reference_letters.pdf"]

email:
  from: "you@example.com"
  # Sending is done through your own transport (MCP bridge or SMTP);
  # configure it locally. swisslifeops prepares drafts by default.
  transport: "draft-only"        # draft-only | smtp | bridge

rav:
  person_nr: "XXXXXXXX"
  office: "RAV Your-Town"
  counselor_email: "counselor@example.ch"

incamail:
  # Your email address = the IncaMail recipient. Used to pass the email-verification gate.
  email: "you@example.com"
  # OPTIONAL: let the CLI fetch the verification link itself (fully standalone, no Claude needed).
  # Use an app password, never your main password; put the secret in the named env var.
  # imap:
  #   host: "imap.gmail.com"
  #   user: "you@example.com"
  #   password_env: "SWISSLIFEOPS_IMAP_PASSWORD"
  #   mailbox: "INBOX"

# Background watcher (run `swisslifeops watch` on a timer). Needs incamail.email + incamail.imap.
# It opens new secured mail, classifies it with a LOCAL model, and queues action cards.
# It NEVER sends, signs, or submits - replies to authorities are always left for you to approve.
watch:
  verify_wait: 300
  ollama:
    base_url: "http://localhost:11434"   # your local Ollama
    model: "qwen2.5:7b"
  # Map document keys to local file paths; the classifier suggests which to attach to a reply.
  dossier:
    cv: "~/lifeops-docs/cv.pdf"
    references: "~/lifeops-docs/reference_letters.pdf"
    # signed_form: "~/lifeops-docs/signed_form.pdf"

skills:
  - "Kubernetes / OpenShift"
  - "CI/CD, Terraform, Ansible"
  - "AWS / Azure / GCP"
  - "Security, IAM, observability"

# Per-employer fit-sheet data (example)
employers:
  example_ag:
    display_name: "Example AG"
    roles: ["Platform Engineer"]
    needs:
      - ["Kubernetes platform", "Ran K8s/OpenShift in production"]
      - ["CI/CD + IaC", "GitLab CI/CD, Terraform, Ansible"]
